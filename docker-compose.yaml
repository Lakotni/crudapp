version: "3.7"
services:
  web-server:
    image: lakotni/backend:sslapache
    restart: always
    ports:
      - "8080:80"
      - "443:443"
    depends_on:
      - db
      - phpmyadmin
    delpoy:
      replicas: 3
  db:
    image: lakotni/db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: '1'
      MYSQL_DATABASE: 'db1'
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.0.1
    restart: always
    environment:
      PMA_HOST: 'db'
      PMA_USER: 'root'
      PMA_PASSWORD: '1'
    ports:
      - "5000:80"
volumes:
  mysql-data:
