<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>EnglishUP — карточки для английского</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

<div class="app-container">

  <!-- Боковая навигация (сайдбар) -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <span class="logo-icon">📘</span>
      <span>EnglishUP</span>
    </div>

    <nav class="nav">
      <div class="nav-item active" data-view="cards">
        <span class="nav-icon">🃟</span>
        <span>Наборы</span>
      </div>
      <div class="nav-item" data-view="dialogs">
        <span class="nav-icon">💬</span>
        <span>Диалоги</span>
      </div>
      <div class="nav-item" data-view="testing">
        <span class="nav-icon">📝</span>
        <span>Тестирование</span>
      </div>
      <div class="nav-item" data-view="journal">
        <span class="nav-icon">📋</span>
        <span>Журнал активности</span>
      </div>
      <div class="nav-item" data-view="settings">
        <span class="nav-icon">⚙️</span>
        <span>Настройки</span>
      </div>
    </nav>

    <div class="user-info">
       <button class="logout-btn" onclick="logout()">🚪 Выйти</button>
    </div>
  </aside>

  <!-- Основной контент -->
  <main class="main-content">
    <header class="content-header">
      <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
      <div class="greeting">
        <h1>Мои наборы</h1>
        <p>Продолжайте учить английский</p>
      </div>
    </header>

    <!-- Быстрые действия -->
    <div class="action-buttons">
      <button class="btn-primary" onclick="location.href='builder.html'">➕ СОЗДАТЬ КАРТОЧКИ</button>
    </div>

    <!-- Мои наборы -->
    <section class="my-sets">
      <h2>📦 Мои наборы</h2>
      <div class="sets-list" id="setsList">
        <div class="empty-state">⏳ Загрузка наборов...</div>
      </div>
    </section>
  </main>
</div>

<div id="loadingOverlay" class="loading-overlay" style="display: none;">
  <div class="loading-spinner"></div>
  <div>Загрузка...</div>
</div>

<div id="toast" class="toast"></div>

<!-- Модальное окно подтверждения удаления -->
<div id="confirmDeleteModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-icon">⚠️</div>
    <h3>Подтверждение удаления</h3>
    <p id="deleteMessage">Вы уверены, что хотите удалить этот набор? Все карточки будут удалены безвозвратно.</p>
    <div class="modal-buttons">
      <button id="confirmDeleteYesBtn" class="modal-btn danger">Да, удалить</button>
      <button id="confirmDeleteNoBtn" class="modal-btn secondary">Отмена</button>
    </div>
  </div>
</div>

<script src="dashboard.js"></script>
<script src="js/navigation.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
