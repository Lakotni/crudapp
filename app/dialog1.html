<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>EnglishUP — Диалоги (список сессий)</title>
  <link rel="stylesheet" href="css/dialogs-1.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

<div class="app-container">

  <!-- Боковая навигация (полностью как в index.html) -->
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-icon">📘</span>
      <span>EnglishUP</span>
    </div>

    <nav class="nav">
      <div class="nav-item" data-view="cards">
        <span class="nav-icon">🃟</span>
        <span>Наборы</span>
      </div>
      <div class="nav-item active" data-view="dialogs">
        <span class="nav-icon">💬</span>
        <span>Диалоги</span>
      </div>
      <div class="nav-item" data-view="testing">
        <span class="nav-icon">📝</span>
        <span>Тестирование</span>
      </div>
      <div class="nav-item" data-view="journal">
        <span class="nav-icon">📋</span>
        <span>Журнал активности</span>
      </div>
      <div class="nav-item" data-view="settings">
        <span class="nav-icon">⚙️</span>
        <span>Настройки</span>
      </div>
    </nav>
     <div class="user-info">
  	<button class="logout-btn" onclick="logout()">🚪 Выйти</button>
    </div>
  
    </aside>

  <!-- Основной контент (список диалогов) -->
  <main class="main-content">
    <header class="content-header">
      <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
      <div class="greeting">
        <h1>Мои диалоговые сессии</h1>
        <p>Общайтесь с ИИ и улучшайте английский</p>
      </div>
    </header>

    <!-- Контейнер со списком диалогов -->
    <div class="sessions-container" id="sessionsContainer">
      <!-- динамическая загрузка из JS -->
    </div>

    <!-- Кнопка создания новой сессии -->
    <div class="action-bottom">
      <button id="createNewSessionBtn" class="btn-primary btn-large">➕ Создать диалоговую сессию</button>
    </div>
  </main>
</div>

<!-- Тостер для отмены удаления -->
<div id="undoToast" class="undo-toast hidden">
  <span>🗑️ Диалог удалён</span>
  <button id="undoDeleteBtn">↩️ Вернуть</button>
</div>
<!-- Модальное окно подтверждения удаления -->
<div id="confirmDeleteModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-icon">⚠️</div>
    <h3>Подтверждение удаления</h3>
    <p id="deleteMessage">Вы уверены, что хотите удалить этот диалог?</p>
    <div class="modal-buttons">
      <button id="confirmDeleteYesBtn" class="modal-btn danger">Да, удалить</button>
      <button id="confirmDeleteNoBtn" class="modal-btn secondary">Отмена</button>
    </div>
  </div>
</div>

<script src="js/dialogs-1.js"></script>
<script src="js/navigation.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
